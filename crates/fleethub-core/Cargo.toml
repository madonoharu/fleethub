[package]
name = "fleethub-core"
version = "1.12.19"
authors = ["Madono <madonoharu@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
description = "fleethub-core"
repository = "https://github.com/madonoharu/fleethub"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = { version = "0.2.129" }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.24.0"
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

anyhow = "1.0.104"
thiserror = "2.0.21"
arrayvec = { version = "0.7.8", features = ["serde"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
enumset = "1.1.14"
enum-map = "3.1.0"
num-traits = "0.2.19"
num-derive = "0.5.1"
strum = { version = "0.28.0", features = ["derive"] }
itertools = "0.15.0"
seq-macro = "0.3.6"
paste = "1.0.15"
tsify = "0.5.8"
fasteval = "0.2.4"
ordered-float = { version = "5.5.0", features = ["serde"] }
gloo-utils = { version = "0.3.0", features = ["serde"] }

[dependencies.web-sys]
version = "0.3.106"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
criterion = "0.8.2"
once_cell = "1.21.4"
toml = "1.1.6"
assert-json-diff = "2.0.2"
walkdir = "2.5.0"
fleethub-core-test = { path = "../fleethub-core-test" }

[[bench]]
name = "bench"
harness = false
