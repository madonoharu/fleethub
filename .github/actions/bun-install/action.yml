name: "Toolchain and Bun install"
description: "Install the mise toolchain and locked workspace dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up tools from mise.toml
      uses: jdx/mise-action@v5
      with:
        version: "2026.10.0"
        cache: ${{ !env.ACT }}

    - name: Restore Bun package cache
      uses: actions/cache@v6
      if: ${{ !env.ACT }}
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      env:
        HUSKY: "0"
