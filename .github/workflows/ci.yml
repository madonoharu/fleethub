name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace dependencies
        run: bun run setup

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test application
        run: bun run test

      - name: Build Next.js application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify deployment artifacts and ISR translations
        run: bun run verify:build

      - name: Test deployment artifacts and missing-file failures
        run: bun run test:build

      - name: Install browser for end-to-end tests
        run: bun run playwright install --with-deps chromium

      - name: Test production application in Chromium
        run: bun run test:e2e
